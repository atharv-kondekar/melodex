<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Albums</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h2>Albums</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Thumbnail</th>
            </tr>
        </thead>

        <tbody id="albumsTableBody">
        </tbody>

    </table>


    <script>

        fetch("http://localhost:8081/albums")

            .then(response => response.json())

            .then(result => {

                const tbody =
                    document.getElementById("albumsTableBody");

                if (!result.data) {
                    throw new Error("Empty Album List.");
                }

                tbody.innerHTML =
                    result.data.map(album => `

                        <tr>

                            <td>
                                ${album.id}
                            </td>

                            <td>
                                ${album.title}
                            </td>

                            <td>

                                <img
                                    src="http://localhost:8081/albums/media/${encodeURIComponent(album.thumbnail)}"
                                    alt="${album.title}"
                                >

                            </td>

                        </tr>

                    `).join("");

            })

            .catch(error => {

                console.error(
                    "Error fetching albums:",
                    error
                );

            });

    </script>

</body>

</html>
