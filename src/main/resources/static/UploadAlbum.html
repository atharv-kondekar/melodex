<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Upload Album — SoundShelf</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand">
				<div class="logo">S</div>
				<div><strong>SoundShelf</strong><small>Music REST App</small></div>
			</div>
			<nav class="nav"><a class="" href="Admin.html">◆ <span>Admin</span></a><a class="" href="Albums.html">◆
					<span>Albums</span></a><a class="" href="Users.html">◆ <span>Users</span></a><a class="active"
					href="UploadAlbum.html">◆ <span>Upload Album</span></a></nav>
			<div class="backend" id="backendStatus"><span class="dot"></span> Checking backend...</div>
		</aside>
		<main class="main">
			<header class="topbar">
				<div>
					<p class="eyebrow">MEDIA</p>
					<h1>Upload Album</h1>
				</div><a class="btn" href="Albums.html">← Library</a>
			</header>
			<div class="card form-card">
				<form id="uploadForm">
					<label for="title">Album title</label>
					<input id="title" type="text" maxlength="150" required placeholder="e.g. Midnight Sessions">
					<label>Artwork / media</label>
					<label class="drop" for="thumbnail">
						<input id="thumbnail" type="file" accept="image/*,video/*,audio/*" required>
						<div><strong>Choose an image, video, or audio file</strong><span id="fileName">No file
								selected</span></div>
					</label>
					<div id="preview" class="preview"><span class="muted">Preview appears here</span></div>
					<button id="submitBtn" class="btn primary" style="width:100%;margin-top:18px" type="submit">Upload
						album</button>
					<div id="message" class="message hidden"></div>
				</form>
			</div>
		</main>
	</div>
	<script src="js/api.js"></script>
	<script src="js/upload.js"></script>
</body>

</html>
