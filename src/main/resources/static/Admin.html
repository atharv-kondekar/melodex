<!DOCTYPE html>
<html lang="en">

<head>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
	<div class="app">

			<nav class="nav"><a class="active" href="Admin.html">◆ <span>Admin</span></a><a class=""
